<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikho - Login Portal</title>
    
    <!-- Shikho Typography: Poppins & Hind Siliguri[cite: 1] -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Shikho Brand Color Config[cite: 1] -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shikho: {
                            indigo: '#304090',
                            magenta: '#C02080',
                            canvas: '#F4F5FA',
                            paper: '#FFFFFF',
                            coral: '#E03050'
                        }
                    },
                    fontFamily: {
                        en: ['Poppins', 'sans-serif'],
                        bn: ['Hind Siliguri', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F4F5FA; /* Canvas background[cite: 1] */
            font-family: 'Hind Siliguri', sans-serif;
        }
        .font-en { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login Card (Rounded shapes)[cite: 1] -->
    <div class="bg-shikho-paper shadow-xl rounded-3xl p-8 max-w-sm w-full text-center relative overflow-hidden">
        
        <!-- Top Magenta Line[cite: 1] -->
        <div class="absolute top-0 left-0 w-full h-2 bg-shikho-magenta"></div>

        <div class="mb-6 mt-2">
            <h1 class="font-en text-shikho-indigo text-4xl font-bold tracking-tighter lowercase">shikho</h1>
            <p class="text-shikho-indigo font-bold text-xs tracking-wider mt-1 uppercase">Evaluation Portal</p>
        </div>

        <h2 class="text-xl font-bold mb-6 text-gray-800">লগিন করে শুরু করো</h2>

        <form class="text-left" onsubmit="handleLogin(event)">
            
            <div class="mb-4">
                <label class="block text-sm font-semibold mb-2 text-gray-700">ইউজার আইডি (qa / agent)</label>
                <input type="text" id="userId" required class="w-full bg-shikho-canvas border-2 border-transparent focus:border-shikho-indigo rounded-xl p-3 outline-none transition-colors" placeholder="qa অথবা agent লেখো">
            </div>

            <div class="mb-8">
                <label class="block text-sm font-semibold mb-2 text-gray-700">পাসওয়ার্ড</label>
                <input type="password" required class="w-full bg-shikho-canvas border-2 border-transparent focus:border-shikho-indigo rounded-xl p-3 outline-none transition-colors" placeholder="পাসওয়ার্ড">
            </div>

            <p id="errorMsg" class="text-shikho-coral text-sm font-semibold mb-4 hidden">❌ ভুল আইডি! 'qa' অথবা 'agent' লিখে চেষ্টা করো।</p>

            <button type="submit" class="w-full bg-shikho-indigo text-white font-bold py-3 px-6 rounded-full hover:opacity-90 transition-opacity flex justify-center items-center gap-2">
                লগিন করুন ➔
            </button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); 
            const userId = document.getElementById('userId').value.toLowerCase().trim();
            const errorMsg = document.getElementById('errorMsg');

            // Routing Logic
            if (userId === 'qa' || userId === 'admin') {
                window.location.href = 'admin/index.html'; // Admin folder-e jabe
            } else if (userId === 'agent') {
                window.location.href = 'agent/index.html'; // Agent folder-e jabe
            } else {
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
