<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shikho - AI eLearning Portal</title>
    
    <!-- Shikho Typography: Poppins & Hind Siliguri -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Shikho Brand Color Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        shikho: {
                            indigo: '#304090',
                            magenta: '#C02080',
                            sunrise: '#E0A010',
                            coral: '#E03050',
                            canvas: '#F4F5FA',
                            paper: '#FFFFFF',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F4F5FA; 
            font-family: 'Hind Siliguri', sans-serif;
            color: #0F1322; 
        }
        .font-en { font-family: 'Poppins', sans-serif; }
        .hidden-view { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Main Card -->
    <div class="max-w-md w-full bg-shikho-paper rounded-2xl shadow-xl p-8 border-t-4 border-shikho-indigo relative overflow-hidden">
        
        <!-- Header with Original Brand Logo -->
        <div class="text-center mb-6 mt-2 flex flex-col items-center">
            <!-- আসল লোগোটি এখানে বসানো হলো -->
            <img src="logo.png" alt="Shikho Logo" class="h-16 mb-2 object-contain">
            
            <p id="page-subtitle" class="text-xs text-gray-500 font-bold uppercase tracking-wider">
                🔒 Secure Portal Access
            </p>
        </div>

        <!-- ================= 1. NORMAL LOGIN FORM ================= -->
        <div id="view-login" class="block animate-fadeIn">
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-bold mb-1 text-gray-600">User ID</label>
                    <input type="text" id="login-id" class="w-full p-3.5 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none font-medium" placeholder="qa, agent অথবা new লিখুন" required>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-bold text-gray-600">Password</label>
                        <button type="button" onclick="switchMode('reset')" class="text-xs text-shikho-magenta hover:underline font-bold transition-colors">
                            Forgot Password?
                        </button>
                    </div>
                    <input type="password" id="login-pass" class="w-full p-3.5 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none font-medium" placeholder="Enter password..." required>
                </div>
                
                <p id="login-error" class="text-shikho-coral text-xs font-bold hidden">❌ আইডি ভুল! 'qa', 'agent' বা 'new' ব্যবহার করুন।</p>

                <button type="submit" class="w-full bg-shikho-indigo hover:opacity-90 text-white py-3.5 rounded-xl font-bold text-lg shadow-md mt-2 transition-all">
                    Secure Login ➔
                </button>
            </form>
        </div>

        <!-- ================= 2. FIRST TIME SECURITY SETUP ================= -->
        <div id="view-setup" class="hidden-view animate-fadeIn">
            <p class="text-xs text-shikho-indigo bg-blue-50 p-3 rounded-lg border border-blue-100 font-medium mb-4">
                স্বাগতম! এটি আপনার প্রথম লগইন। পরবর্তীতে পাসওয়ার্ড ভুলে গেলে আইডি রিকভার করার জন্য আপনার সঠিক তথ্যগুলো সেভ করে রাখুন।
            </p>
            <form onsubmit="handleSetup(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">📱 Mobile Number</label>
                    <input type="text" class="w-full p-3 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none text-sm font-medium" placeholder="e.g. 01700000000" required>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 text-gray-600">📅 Date of Birth</label>
                    <input type="date" class="w-full p-3 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none text-sm font-medium" required>
                </div>
                <button type="submit" class="w-full bg-shikho-sunrise hover:opacity-90 text-white py-3.5 rounded-xl font-bold text-sm shadow-md mt-2 transition-all">
                    Save Profile & Continue
                </button>
            </form>
        </div>

        <!-- ================= 3. FORGOT PASSWORD / RESET ================= -->
        <div id="view-reset" class="hidden-view animate-fadeIn">
            <p class="text-xs text-[#A27509] bg-[#FBEBC2] p-3 rounded-lg border border-shikho-sunrise font-medium mb-4">
                পাসওয়ার্ড রিসেট করতে আপনার রেজিস্টার্ড তথ্যগুলো দিন:
            </p>
            <form onsubmit="handleReset(event)" class="space-y-3.5 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">User ID</label>
                    <input type="text" class="w-full p-2.5 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none text-sm font-medium" placeholder="e.g. agent-01" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Mobile Number</label>
                    <input type="text" class="w-full p-2.5 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none text-sm font-medium" placeholder="e.g. 01700000000" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Date of Birth</label>
                    <input type="date" class="w-full p-2.5 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none text-sm font-medium" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">New Password</label>
                    <input type="password" class="w-full p-2.5 rounded-xl border-2 border-transparent bg-shikho-canvas focus:border-shikho-indigo outline-none text-sm font-medium" placeholder="Enter new password" required>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="switchMode('login')" class="w-1/3 py-2.5 rounded-xl font-bold text-sm bg-gray-200 text-gray-600 hover:bg-gray-300 transition-colors">
                        Back
                    </button>
                    <button type="submit" class="w-2/3 bg-shikho-sunrise hover:opacity-90 text-white py-2.5 rounded-xl font-bold text-sm shadow-md transition-all">
                        Verify & Reset
                    </button>
                </div>
            </form>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        function switchMode(mode) {
            document.getElementById('view-login').classList.add('hidden-view');
            document.getElementById('view-setup').classList.add('hidden-view');
            document.getElementById('view-reset').classList.add('hidden-view');
            document.getElementById('login-error').classList.add('hidden'); 

            const subtitle = document.getElementById('page-subtitle');
            
            if (mode === 'login') {
                document.getElementById('view-login').classList.remove('hidden-view');
                subtitle.innerText = '🔒 Secure Portal Access';
            } else if (mode === 'setup') {
                document.getElementById('view-setup').classList.remove('hidden-view');
                subtitle.innerText = '🛡️ First Time Setup';
            } else if (mode === 'reset') {
                document.getElementById('view-reset').classList.remove('hidden-view');
                subtitle.innerText = '🔑 Reset Password';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('login-id').value.toLowerCase().trim();
            const errorMsg = document.getElementById('login-error');

            if (id === 'qa' || id === 'admin') {
                window.location.href = 'admin/index.html';
            } else if (id === 'agent') {
                window.location.href = 'agent/index.html';
            } else if (id === 'new') {
                switchMode('setup');
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function handleSetup(event) {
            event.preventDefault();
            alert("✅ আপনার প্রোফাইল সেভ হয়েছে! এজেন্ট ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে...");
            window.location.href = 'agent/index.html';
        }

        function handleReset(event) {
            event.preventDefault();
            alert("✅ পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে! নতুন পাসওয়ার্ড দিয়ে লগইন করুন।");
            switchMode('login');
        }
    </script>
</body>
</html>
